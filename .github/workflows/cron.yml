name: cron

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "15 8 * * *"
  workflow_dispatch:

jobs:
  deliver:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Deliver email
        env:
          APP_URL: https://matops.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          out=$(curl -fsS --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/deliver")
          echo "$out"
          test "$(echo "$out" | jq -r '.ok')" = "true"

  memberships:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 8 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Membership reminders and overdue bookings
        env:
          APP_URL: https://matops.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          cursor=""
          for attempt in $(seq 1 20); do
            if [ -n "$cursor" ]; then
              out=$(curl -fsS --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors \
                --get --data-urlencode "after=$cursor" \
                -H "Authorization: Bearer $CRON_SECRET" \
                "$APP_URL/api/cron/memberships")
            else
              out=$(curl -fsS --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors \
                -H "Authorization: Bearer $CRON_SECRET" \
                "$APP_URL/api/cron/memberships")
            fi
            echo "$out"
            test "$(echo "$out" | jq -r '.ok')" = "true"
            if [ "$(echo "$out" | jq -r '.hasMore')" != "true" ]; then
              exit 0
            fi
            cursor=$(echo "$out" | jq -r '.nextCursor')
            test -n "$cursor"
          done
          exit 1

  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 8 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Extend calendars
        env:
          APP_URL: https://matops.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for attempt in $(seq 1 20); do
            out=$(curl -fsS --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/cron/materialize")
            echo "$out"
            test "$(echo "$out" | jq -r '.ok')" = "true"
            if [ "$(echo "$out" | jq -r '.hasMore')" != "true" ]; then
              exit 0
            fi
          done
          exit 1
